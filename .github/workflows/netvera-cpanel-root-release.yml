name: NetVera cPanel Tek ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'well-known/bin/build-netvera-root-zip.php'
      - 'well-known/.htaccess'
      - 'well-known/resources/views/layouts/admin.php'
      - 'well-known/app/Controllers/Admin/AdminAccountController.php'
      - 'well-known/app/Controllers/Admin/AuthController.php'
      - 'well-known/app/Core/AdminAuth.php'
      - '.github/workflows/netvera-cpanel-root-release.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mbstring, pdo_mysql, gd, xml, dom, simplexml, xmlreader, xmlwriter, fileinfo, iconv
          tools: composer:v2
      - name: Install production dependencies
        working-directory: well-known
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
      - name: Build and validate the one-level root ZIP
        shell: bash
        run: |
          set -euo pipefail
          php well-known/bin/build-netvera-root-zip.php
          file="$(find . -maxdepth 1 -name 'netvera-tr-cpanel-root-*.zip' -type f | head -n 1)"
          test -n "$file"
          unzip -t "$file" >/dev/null
          for required in app/Core/AdminAuth.php public/index.php .htaccess .env vendor/autoload.php database/database.sql NETVERA-ILK-OKU.txt resources/views/admin/settings/admin-user-edit.php; do
            unzip -Z1 "$file" | grep -Fqx "$required"
          done
          test "$(unzip -Z1 "$file" | grep -cx '\.env')" -eq 1
          test "$(unzip -Z1 "$file" | grep -cE '\.sql$')" -eq 1
          if unzip -Z1 "$file" | grep -Eq '^(well-known/|\.env\.|blog\.netvera\.tr/|lisans\.netvera\.tr/|public/uploads/|storage/uploads/)|sync-conflict'; then
            echo 'Unsafe ZIP: extra nesting, duplicate env, subdomain, uploads or conflict'
            exit 1
          fi
          echo "Verified cPanel-ready root ZIP: $file"
      - name: Upload one cPanel-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NetVera-cPanel-TekZIP-Direkt-Extract
          path: netvera-tr-cpanel-root-*.zip
          retention-days: 14
          if-no-files-found: error
