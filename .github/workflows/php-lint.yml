name: PHP Lint

on:
  push:
    branches: [main, 'staging/netvera-source-integration']
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP syntax check
        run: |
          set -e
          find well-known -type f -name "*.php" -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done

      - name: Retired ready-software category 301 and menu parity QA
        run: php well-known/tests/retired-software-category-qa.php

      - name: Public SEO slug, redirects and canonical URL QA
        run: php well-known/tests/public-slug-url-qa.php

      - name: Admin release text QA
        run: php well-known/tests/admin-release-copy-qa.php
      - name: Minimal production UI copy QA
        run: php well-known/tests/production-ui-copy-qa.php
      - name: Reviews, flat payment modules and mobile desk QA
        run: php well-known/tests/reviews-mobile-desk-qa.php
      - name: Distinct social-platform colors and category flows QA
        run: php well-known/tests/social-platform-identity-qa.php
      - name: Parent-platform identity and flat CSS regression QA
        run: php well-known/tests/platform-parent-flat-ui-v80-qa.php

      - name: Platform category visual identities and carousel QA
        run: |
          php well-known/tests/platform-category-design-qa.php
          node --check well-known/public/assets/js/home-featured-tabs-v18.js
          node --check well-known/tests/visual-smoke.mjs

      - name: Single category color and icon system QA
        run: php well-known/tests/catalog-visual-parity-v84-qa.php

      - name: Header reputation / Google menu visual parity QA
        run: php well-known/tests/header-reputation-parity-v83-qa.php

      - name: NetVera screenshot fixes and script catalog QA
        run: php well-known/tests/netvera-visual-brand-catalog-v76-qa.php

      - name: Service category visibility and brand palette QA
        run: php well-known/tests/service-category-visibility-v82-qa.php

      - name: NetVera global brand settings and SEO GEO AIO QA
        run: php well-known/tests/netvera-brand-settings-qa.php

      - name: All category SEO, GEO and AIO modules QA
        run: php well-known/tests/netvera-category-complete-seo-v73-qa.php

      - name: NetVera brand, theme, chat and category SEO QA
        run: |
          php well-known/tests/netvera-brand-theme-seo-chat-qa.php
          node --check well-known/public/assets/js/inbox-desktop-v70.js

      - name: Mobile browser JavaScript syntax
        run: |
          node --check well-known/public/assets/js/reviews-v68.js
          node --check well-known/public/assets/js/nv-desk.js
          node --check well-known/public/assets/js/nv-desk-alerts.js
          node --check well-known/public/assets/js/nv-desk-admin.js
          node --check well-known/public/nv-desk-sw.js

      - name: Offline SMM provider encryption and endpoint QA
        run: php well-known/tests/smm-api-qa.php
      - name: Social media target validation and package carousel QA
        run: php well-known/tests/smm-target-and-ui-qa.php

      - name: Categorized project references and Instagram embed regression
        run: php well-known/tests/reference-portfolio-qa.php

      - name: Verify genuine Netvera blog covers and inline image files
        run: php well-known/tests/netvera-blog-media-qa.php
      - name: Netvera SEO GEO AIO content scoring regression
        run: php well-known/tests/netvera-blog-quality-qa.php
      - name: Original Netvera Markdown rendering and link safety
        run: |
          php -r '
            require "well-known/app/Services/BlogContentRenderer.php";
            $data=json_decode(file_get_contents("well-known/database/netvera-public-catalog.json"),true);
            if(count($data["blog_posts"])<5)exit(1);
            foreach($data["blog_posts"] as $article){
                $html=\App\Services\BlogContentRenderer::render($article["content"]);
                if(strpos($html,"<h2>")===false||strpos($html,"<img ")===false||
                   strpos($html,"<p>")===false||
                   (strpos($article["content"],"**")!==false && strpos($html,"<strong>")===false))
                   {fwrite(STDERR,"Invalid markdown rendering: ".$article["slug"]."\n");exit(1);}
                if(strpos($html,"<script")!==false)exit(1);
            }
            $unsafe=\App\Services\BlogContentRenderer::render("## Heading\n[evil](javascript:alert(1))\n<script>alert(1)</script>");
            if(strpos($unsafe,"href=\"javascript:")!==false||strpos($unsafe,"<script")!==false)exit(1);
            $html="<p>Already saved editor HTML <strong>preserved</strong></p>";
            if(\App\Services\BlogContentRenderer::render($html)!==$html)exit(1);
            echo "PASS: five authentic Markdown articles, image/links and unsafe URL rejection.\n";
          '
