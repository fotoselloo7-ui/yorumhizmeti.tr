name: PHP Lint

on:
  push:
    branches: [main, 'staging/netvera-source-integration']
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP syntax check
        run: |
          set -e
          find well-known -type f -name "*.php" -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
