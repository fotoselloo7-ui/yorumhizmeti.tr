name: Build transparent brand cutouts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-transparent-brand-assets.yml"

permissions:
  contents: write

jobs:
  build-cutouts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install background remover
        run: |
          python -m pip install --upgrade pip
          pip install "rembg[cpu,cli]" pillow

      - name: Download licensed source photos
        run: |
          mkdir -p /tmp/yh-assets /tmp/yh-output
          curl -L --fail --retry 3 \
            "https://images.pexels.com/photos/16459052/pexels-photo-16459052.jpeg?cs=srgb&fm=jpg" \
            -o /tmp/yh-assets/hero.jpg
          curl -L --fail --retry 3 \
            "https://images.pexels.com/photos/6502999/pexels-photo-6502999.jpeg?cs=srgb&fm=jpg" \
            -o /tmp/yh-assets/blog.jpg
          curl -L --fail --retry 3 \
            "https://images.pexels.com/photos/6502997/pexels-photo-6502997.jpeg?cs=srgb&fm=jpg" \
            -o /tmp/yh-assets/support.jpg

      - name: Remove backgrounds
        run: |
          rembg i -m u2netp /tmp/yh-assets/hero.jpg /tmp/yh-output/hero-woman-cutout.png
          rembg i -m u2netp /tmp/yh-assets/blog.jpg /tmp/yh-output/blog-woman-cutout.png
          rembg i -m u2netp /tmp/yh-assets/support.jpg /tmp/yh-output/support-woman-cutout.png

      - name: Normalize PNG dimensions and trim
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          for p in Path("/tmp/yh-output").glob("*-woman-cutout.png"):
              im = Image.open(p).convert("RGBA")
              bbox = im.getchannel("A").getbbox()
              if bbox:
                  im = im.crop(bbox)
              max_h = 1500
              if im.height > max_h:
                  ratio = max_h / im.height
                  im = im.resize((max(1, int(im.width * ratio)), max_h), Image.Resampling.LANCZOS)
              im.save(p, optimize=True)
              print(p, im.size, "alpha:", im.getchannel("A").getextrema())
          PY

      - name: Commit generated transparent assets
        run: |
          git config user.name "YorumHizmeti Visual Bot"
          git config user.email "actions@users.noreply.github.com"

          # Sync the latest branch before touching binary assets so concurrent
          # storefront commits cannot create binary rebase conflicts.
          git fetch origin main
          git reset --hard origin/main

          mkdir -p well-known/public/assets/img
          cp /tmp/yh-output/*-woman-cutout.png well-known/public/assets/img/

          git add well-known/public/assets/img/*-woman-cutout.png
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi

          git commit -m "Generate transparent cutout brand imagery"
          git push origin main
