name: NetVera Landing OG Yukleme ve Tema Duzeltme ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netvera-landing-og-and-theme-layout.yml'
      - 'well-known/tests/landing-themes-centered-qa.cjs'

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, fileinfo, gd
          tools: none
      - name: Lint only affected PHP and JS files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            well-known/app/Controllers/Admin/LandingController.php \
            well-known/resources/views/admin/landing/seo-fields.php \
            well-known/resources/views/layouts/admin.php \
            well-known/resources/views/layouts/app.php; do
            php -l "$file"
          done
          node --check well-known/public/assets/js/landing-editor.js
          node --check well-known/tests/landing-themes-centered-qa.cjs
          grep -Fq 'seo_og_image_upload' well-known/app/Controllers/Admin/LandingController.php
          grep -Fq 'seo_og_image_upload' well-known/resources/views/admin/landing/seo-fields.php
          grep -Fq 'Content::upload' well-known/app/Controllers/Admin/LandingController.php
          grep -Fq 'columns:2' well-known/public/assets/css/landing-themes.css
      - name: Setup isolated Chromium layout QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/playwright-qa"
          cd "$RUNNER_TEMP/playwright-qa"
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Check ten theme layouts on Chrome engine
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/playwright-qa/node_modules" RUNNER_TEMP="$RUNNER_TEMP" node well-known/tests/landing-themes-centered-qa.cjs
      - name: Package ONLY 1200px layout CSS and public stylesheet cache version
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/landing-1200-fix"
          mkdir -p "$stage/public/assets/css" "$stage/resources/views/layouts"
          cp well-known/public/assets/css/landing-themes.css "$stage/public/assets/css/landing-themes.css"
          cp well-known/resources/views/layouts/app.php "$stage/resources/views/layouts/app.php"
          cat > "$stage/KURULUM-OKU.txt" <<'EOF'
          NETVERA 1200PX LANDING SAYFA DUZELTMESI
          Sadece iki dosya: public/assets/css/landing-themes.css
          ve resources/views/layouts/app.php
          netvera.tr belge kokunde Extract yaparak uzerine yazin.
          SQL, .env, admin, odemeler, urunler, subdomainler ve sayfa icerigi degismez.
          Tarayicida CTRL+SHIFT+R ile yenileyin; sayfa temasi aynen kalir.
          Yedek almayi unutmayin.
          EOF
          (
            cd "$stage"
            zip -qr "$GITHUB_WORKSPACE/NETVERA-1200PX-LANDING-HIZA-DUZELTME.zip" public resources KURULUM-OKU.txt
          )
          file="$GITHUB_WORKSPACE/NETVERA-1200PX-LANDING-HIZA-DUZELTME.zip"
          unzip -t "$file" >/dev/null
          test "$(unzip -Z1 "$file" | grep -Ec '[.](php|js|css)$')" -eq 2
          unzip -Z1 "$file" | grep -qx 'resources/views/layouts/app.php'
          unzip -Z1 "$file" | grep -qx 'public/assets/css/landing-themes.css'
          if unzip -Z1 "$file" | grep -Eq '(^well-known/|^\.env|\.sql$|sync-conflict|^public/uploads/)'; then
            echo 'Unsafe or unintended file in patch'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NETVERA-1200PX-LANDING-HIZA-DUZELTME
          path: NETVERA-1200PX-LANDING-HIZA-DUZELTME.zip
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NetVera-Green-Route-Browser-QA-Screenshots
          path: ${{ runner.temp }}/netvera-green-route-*.png
          retention-days: 7
          if-no-files-found: ignore
