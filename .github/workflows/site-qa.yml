name: Responsive & Browser QA

on:
  workflow_dispatch:
  push:
    branches: [main, staging/netvera-source-integration]
    paths:
      - 'well-known/**'
      - '.github/workflows/site-qa.yml'

concurrency:
  group: storefront-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: qa_test_only_password
          MYSQL_DATABASE: yorumhizmeti_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -pqa_test_only_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, curl, gd
          tools: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install MySQL client and import demo data
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client
          mysql --host=127.0.0.1 --port=3306 -uroot -pqa_test_only_password yorumhizmeti_ci < yorumhizmeti_yorumhizmeti.sql
          # Isolated CI DB only: test admin login and horizontal carousel with real data.
          qa_hash=$(php -r 'echo password_hash("qa-test-menu-only", PASSWORD_DEFAULT);')
          mysql --host=127.0.0.1 --port=3306 -uroot -pqa_test_only_password yorumhizmeti_ci -e "UPDATE admins SET password='${qa_hash}', must_change_password=0 WHERE id=1;"
          mysql --host=127.0.0.1 --port=3306 -uroot -pqa_test_only_password yorumhizmeti_ci -e "UPDATE packages SET is_featured=1 WHERE status='active';"
          # SEO route parity: use synthetic data only, never live payment or customer SQL.
          mysql --host=127.0.0.1 --port=3306 -uroot -pqa_test_only_password yorumhizmeti_ci < well-known/database/migrations/netvera-legacy-bridge-v1.sql
          mysql --host=127.0.0.1 --port=3306 -uroot -pqa_test_only_password yorumhizmeti_ci < well-known/tests/netvera-public-ci-seed.sql


      - name: Configure isolated local test environment
        shell: bash
        run: |
          cat > well-known/.env <<'EOF'
          APP_NAME="YorumHizmeti CI"
          APP_ENV=local
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:8006
          DB_HOST=127.0.0.1
          DB_NAME=yorumhizmeti_ci
          DB_USER=root
          DB_PASS=qa_test_only_password
          DB_CHARSET=utf8mb4
          LICENSE_ENABLED=false
          LICENSE_LOCAL_BYPASS=true
          # Keep synthetic 3-product browser fixture intact; local bootstrap has its own integration test.
          NETVERA_LOCAL_AUTO_SETUP=0
          EOF
          mkdir -p well-known/storage/cache well-known/storage/logs well-known/public/uploads
          php -S 127.0.0.1:8006 -t well-known/public well-known/tests/router.php > /tmp/yorum-qa-php.log 2>&1 &
          echo "$!" > /tmp/yorum-qa-php.pid
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8006/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/yorum-qa-php.log
          exit 1

      - name: Verify private in-host migration of PUBLIC demo accounts (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          mysql --host=127.0.0.1 -uroot -pqa_test_only_password yorumhizmeti_ci <<'SQL'
          CREATE TABLE script_products (
            id INT PRIMARY KEY,
            slug VARCHAR(180) NOT NULL,
            demo_url VARCHAR(255) NULL,
            demo_admin_url VARCHAR(255) NULL,
            demo_user_url VARCHAR(255) NULL,
            demo_username VARCHAR(190) NULL,
            demo_password VARCHAR(190) NULL,
            demo_admin_username VARCHAR(190) NULL,
            demo_admin_password VARCHAR(190) NULL,
            demo_note TEXT NULL,
            demo_accounts_json LONGTEXT NULL,
            demo_video_url VARCHAR(255) NULL,
            demo_is_active TINYINT DEFAULT 0,
            demo_is_public TINYINT DEFAULT 0,
            demo_display_mode VARCHAR(30) NULL,
            is_active TINYINT DEFAULT 1
          );
          INSERT INTO script_products
            (id,slug,demo_url,demo_admin_url,demo_username,demo_password,
             demo_admin_username,demo_admin_password,demo_note,demo_accounts_json,
             demo_is_active,demo_is_public,demo_display_mode,is_active)
          VALUES (49,'netvera-temizlik-firmasi-script-yazilimi-pro',
            'https://qa-cleaning.example.test','https://qa-cleaning.example.test/admin',
            'qa-test-user','synthetic-qa-only-no-real-account',
            'qa-test-admin','synthetic-qa-only-no-real-account','Deneme erişimi','[]',
            1,1,'public',1);
          SQL
          php -l well-known/scripts/sync-netvera-public-demo-logins.php
          php well-known/scripts/sync-netvera-public-demo-logins.php > /tmp/public-demo-dryrun.txt
          grep -q "DRY_RUN_NO_WRITES" /tmp/public-demo-dryrun.txt
          mysql --host=127.0.0.1 -uroot -pqa_test_only_password yorumhizmeti_ci -N -B -e \
            "SELECT JSON_EXTRACT(public_json,'$.demo_admin_url') FROM nv_legacy_script_products WHERE legacy_id=49" \
            | grep -qx 'NULL'
          NETVERA_DEMO_SYNC_APPROVED=1 NETVERA_PUBLIC_DEMO_LOGINS=1 \
            php well-known/scripts/sync-netvera-public-demo-logins.php --apply > /tmp/public-demo-import.txt
          grep -q "UPDATED_PRIVATE_DATABASE" /tmp/public-demo-import.txt
          mysql --host=127.0.0.1 -uroot -pqa_test_only_password yorumhizmeti_ci -N -B -e \
            "SELECT JSON_UNQUOTE(JSON_EXTRACT(public_json,'$.demo_admin_url')) FROM nv_legacy_script_products WHERE legacy_id=49" \
            | grep -qx 'https://qa-cleaning.example.test/admin'
          mysql --host=127.0.0.1 -uroot -pqa_test_only_password yorumhizmeti_ci -N -B -e \
            "SELECT JSON_EXTRACT(public_json,'$.demo_credentials_public') FROM nv_legacy_script_products WHERE legacy_id=49" \
            | grep -qx '1'
          NETVERA_DEMO_SYNC_APPROVED=1 NETVERA_PUBLIC_DEMO_LOGINS=1 \
            php well-known/scripts/sync-netvera-public-demo-logins.php --apply > /tmp/public-demo-reimport.txt
          echo "PASS: private demo migration dry run, target-only updates, consent gate and repeatability"

      - name: Install browser automation
        run: |
          npm --prefix well-known install --no-save --no-package-lock playwright
          cd well-known
          npx playwright install --with-deps chromium

      - name: Browser audit and screenshots
        id: audit
        run: node well-known/tests/visual-smoke.mjs
        env:
          QA_ORIGIN: http://127.0.0.1:8006
          QA_OUTPUT: qa-artifacts

      - name: Upload screenshots and JSON audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-qa-screenshots-${{ github.run_number }}
          path: qa-artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: PHP server log on failure
        if: failure()
        run: tail -n 180 /tmp/yorum-qa-php.log
