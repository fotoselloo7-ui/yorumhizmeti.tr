name: NetVera Landing Kart ve Soru Cevap Duzeltmesi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netvera-regional-cards-sticky-fix.yml'
      - 'well-known/tests/regional-cards-and-sticky-qa.cjs'
jobs:
  qa-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml
          tools: none
      - name: PHP and JS syntax and layout markers
        shell: bash
        run: |
          set -euo pipefail
          php -l well-known/resources/views/frontend/landing/editorial-deep.php
          php -l well-known/resources/views/layouts/app.php
          node --check well-known/public/assets/js/regional-showcase-v1.js
          node --check well-known/tests/regional-cards-and-sticky-qa.cjs
          grep -Fq 'grid-auto-columns:var(--nvl-rail-card-width' well-known/public/assets/css/regional-showcase-v1.css
          grep -Fq 'max-height:none!important' well-known/public/assets/css/regional-showcase-v1.css
      - name: Isolated Chromium test setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwqa"
          cd "$RUNNER_TEMP/pwqa"
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Ten-theme carousel and whole-sidebar QA
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pwqa/node_modules" RUNNER_TEMP="$RUNNER_TEMP" node well-known/tests/regional-cards-and-sticky-qa.cjs
      - name: Package only five changed files
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/regionfix"
          mkdir -p "$stage"
          for source in \
            well-known/public/assets/css/landing-themes.css \
            well-known/public/assets/css/regional-showcase-v1.css \
            well-known/public/assets/js/regional-showcase-v1.js \
            well-known/resources/views/frontend/landing/editorial-deep.php \
            well-known/resources/views/layouts/app.php; do
            target="\${source#well-known/}"
            mkdir -p "$stage/$(dirname "$target")"
            cp "$source" "$stage/$target"
          done
          cat > "$stage/ONCE-OKU.txt" <<'EOF'
          NETVERA KART VE REHBER SUTUN DUZELTMESI
          netvera.tr ana kok dizinine yukleyip Extract yapin.
          Bes dosyanin uzerine yazilir, yedek alin.
          SQL, .env, PayTR, admin, sayfa icerigi, lisans degismez.
          Yukleme sonrasi Ctrl+Shift+R ile yenileyin.
          EOF
          (
            cd "$stage"
            zip -qr "$GITHUB_WORKSPACE/NETVERA-KART-SUTUN-SON-DUZELTME.zip" public resources ONCE-OKU.txt
          )
          archive="$GITHUB_WORKSPACE/NETVERA-KART-SUTUN-SON-DUZELTME.zip"
          unzip -t "$archive" >/dev/null
          actual=$(unzip -Z1 "$archive" | grep -E '[.](php|js|css)$' | wc -l)
          test "$actual" -eq 5
          for expected in \
            public/assets/css/landing-themes.css \
            public/assets/css/regional-showcase-v1.css \
            public/assets/js/regional-showcase-v1.js \
            resources/views/frontend/landing/editorial-deep.php \
            resources/views/layouts/app.php; do
            unzip -Z1 "$archive" | grep -Fxq "$expected"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: NETVERA-KART-SUTUN-SON-DUZELTME
          path: NETVERA-KART-SUTUN-SON-DUZELTME.zip
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NetVera-QA-Gorsel
          path: \${{ runner.temp }}/netvera-regional-cards-desktop.png
          retention-days: 7
          if-no-files-found: ignore
