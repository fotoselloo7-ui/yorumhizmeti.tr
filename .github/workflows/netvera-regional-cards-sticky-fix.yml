name: NetVera Landing Kartlari ve Sticky Rehber Duzeltmesi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netvera-regional-cards-sticky-fix.yml'
      - 'well-known/tests/regional-cards-and-sticky-qa.cjs'

jobs:
  qa-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml
          tools: none
      - name: Lint only changed files
        shell: bash
        run: |
          set -euo pipefail
          php -l well-known/resources/views/frontend/landing/editorial-deep.php
          php -l well-known/resources/views/layouts/app.php
          node --check well-known/public/assets/js/regional-showcase-v1.js
          node --check well-known/tests/regional-cards-and-sticky-qa.cjs
          grep -Fq 'scroll-snap-type:x mandatory' well-known/public/assets/css/regional-showcase-v1.css
          grep -Fq 'position:sticky' well-known/public/assets/css/regional-showcase-v1.css
      - name: Install isolated Chromium QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwqa"
          cd "$RUNNER_TEMP/pwqa"
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Test 10 themes and complete end card at desktop/mobile
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pwqa/node_modules" RUNNER_TEMP="$RUNNER_TEMP" node well-known/tests/regional-cards-and-sticky-qa.cjs
      - name: Package ONLY 4 updated files for cPanel root
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/regionfix"
          mkdir -p "$stage"
          for source in \
            well-known/public/assets/css/regional-showcase-v1.css \
            well-known/public/assets/js/regional-showcase-v1.js \
            well-known/resources/views/frontend/landing/editorial-deep.php \
            well-known/resources/views/layouts/app.php; do
            target="${source#well-known/}"
            mkdir -p "$stage/$(dirname "$target")"
            cp "$source" "$stage/$target"
          done
          cat > "$stage/ONCE-OKU.txt" <<'EOF'
          NETVERA KART / REHBER DUZELTMESI
          cPanel netvera.tr kok dizinine yukle ve Extract yap.
          Yeni 4 dosya app, SQL, .env, hosting, PayTR, lisans,
          SEO icerikleri ve alt alan adlarini degistirmez.
          Yalnizca public/assets/css/regional-showcase-v1.css,
          public/assets/js/regional-showcase-v1.js,
          resources/views/frontend/landing/editorial-deep.php,
          resources/views/layouts/app.php degisir.
          Once mevcut 4 dosyanin yedegini al; sayfayi Ctrl+Shift+R ile yenile.
          EOF
          (
            cd "$stage"
            zip -qr "$GITHUB_WORKSPACE/NETVERA-KART-KESILME-BOSLUK-STICKY-DUZELTME.zip" public resources ONCE-OKU.txt
          )
          file="$GITHUB_WORKSPACE/NETVERA-KART-KESILME-BOSLUK-STICKY-DUZELTME.zip"
          unzip -t "$file" >/dev/null
          test "$(unzip -Z1 "$file" | grep -Ec '[.](php|js|css)$')" -eq 4
          unzip -Z1 "$file" | grep -qx 'public/assets/css/regional-showcase-v1.css'
          unzip -Z1 "$file" | grep -qx 'public/assets/js/regional-showcase-v1.js'
          unzip -Z1 "$file" | grep -qx 'resources/views/frontend/landing/editorial-deep.php'
          unzip -Z1 "$file" | grep -qx 'resources/views/layouts/app.php'
          if unzip -Z1 "$file" | grep -Eq '(^well-known/|^\.env|\.sql$|sync-conflict|^public/uploads/)'; then
            echo 'Unexpected file in hotfix ZIP';exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NETVERA-KART-KESILME-BOSLUK-STICKY-DUZELTME
          path: NETVERA-KART-KESILME-BOSLUK-STICKY-DUZELTME.zip
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NetVera-Regional-QA-Screenshot
          path: ${{ runner.temp }}/netvera-regional-cards-desktop.png
          retention-days: 7
          if-no-files-found: ignore
