name: NetVera Yazilim Domain Hosting Siparis Bilgileri
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netvera-script-installation-details-patch.yml'
      - 'well-known/tests/script-checkout-installation-qa.php'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          tools: none
      - name: PHP lint and installation metadata regression
        shell: bash
        run: |
          set -euo pipefail
          php -l well-known/app/Controllers/ScriptCheckoutController.php
          php -l well-known/resources/views/frontend/script-checkout.php
          php -l well-known/resources/views/admin/orders/detail.php
          php -l well-known/tests/script-checkout-installation-qa.php
          php well-known/tests/script-checkout-installation-qa.php
      - name: Verify unchanged PayTR contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "initiatePayment" well-known/app/Controllers/ScriptCheckoutController.php
          grep -Fq "purchase_nonce" well-known/app/Controllers/ScriptCheckoutController.php
          grep -Fq "FOR UPDATE" well-known/app/Controllers/ScriptCheckoutController.php
          grep -Fq "terms_accepted" well-known/app/Controllers/ScriptCheckoutController.php
          grep -Fq "nv_install_domain" well-known/app/Controllers/ScriptCheckoutController.php
          grep -Fq "nv_install_hosting" well-known/app/Controllers/ScriptCheckoutController.php
          grep -Fq "nvInstallFields" well-known/resources/views/admin/orders/detail.php
          grep -Fq "install_hosting_provider" well-known/resources/views/frontend/script-checkout.php
      - name: Build one-layer cPanel patch
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/nv-script-install"
          mkdir -p "$stage"
          for source in \
            well-known/app/Controllers/ScriptCheckoutController.php \
            well-known/resources/views/frontend/script-checkout.php \
            well-known/resources/views/admin/orders/detail.php; do
            dest="${source#well-known/}"
            mkdir -p "$stage/$(dirname "$dest")"
            cp "$source" "$stage/$dest"
          done
          cat > "$stage/KURULUM-OKU.txt" <<'INFO'
          NetVera Hazir Yazilim Kurulum Bilgileri
          Mevcut netvera.tr cPanel ana klasorunde Extract yapin.
          Guncellenen 3 dosya: app/Controllers/ScriptCheckoutController.php,
          resources/views/frontend/script-checkout.php ve
          resources/views/admin/orders/detail.php
          SQL, .env, alt alan adlari, PayTR API ayarlari degismez.
          Musteri sifrelerini bu forma istemeyin: guvenli kanal kullanin.
          Domain/hosting bilgileri mevcut order_fields tablosuna yazilir.
          Once dosya ve DB yedegi alin. Canli PayTR testini kontrollu yapin.
          INFO
          (
            cd "$stage"
            zip -qr "$GITHUB_WORKSPACE/NETVERA-YAZILIM-DOMAIN-HOSTING-BILGILERI.zip" app resources KURULUM-OKU.txt
          )
          file="$GITHUB_WORKSPACE/NETVERA-YAZILIM-DOMAIN-HOSTING-BILGILERI.zip"
          unzip -t "$file" >/dev/null
          test "$(unzip -Z1 "$file" | grep -c '\.php$')" -eq 3
          unzip -Z1 "$file" | grep -qx 'KURULUM-OKU.txt'
          if unzip -Z1 "$file" | grep -Eq '(^well-known/|^\.env|\.sql$|sync-conflict|^public/uploads/)'; then
            echo "Unexpected file in patch"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NETVERA-YAZILIM-DOMAIN-HOSTING-BILGILERI
          path: NETVERA-YAZILIM-DOMAIN-HOSTING-BILGILERI.zip
          retention-days: 14
          if-no-files-found: error
