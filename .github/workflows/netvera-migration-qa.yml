name: Netvera Public Migration QA

on:
  push:
    branches: [staging/netvera-source-integration]
    paths:
      - 'well-known/database/netvera-public-catalog.json'
      - 'well-known/scripts/import-netvera-public.php'
      - 'well-known/app/Services/NetveraBridgeService.php'
      - 'well-known/database/migrations/netvera-legacy-bridge-v1.sql'
      - '.github/workflows/netvera-migration-qa.yml'
  workflow_dispatch:

jobs:
  safe-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: migration_qa_only
          MYSQL_DATABASE: netvera_migration_qa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -pmigration_qa_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, fileinfo, zip
          tools: none
      - name: Prepare isolated CI database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client
          mysql -h127.0.0.1 -uroot -pmigration_qa_only netvera_migration_qa < yorumhizmeti_yorumhizmeti.sql
          cat > well-known/.env <<'EOF'
          APP_ENV=staging
          APP_DEBUG=false
          APP_URL=http://127.0.0.1:8917
          DB_HOST=127.0.0.1
          DB_NAME=netvera_migration_qa
          DB_USER=root
          DB_PASS=migration_qa_only
          DB_CHARSET=utf8mb4
          NETVERA_IMPORT_ALLOWED=1
          LICENSE_ENABLED=false
          LICENSE_LOCAL_BYPASS=true
          EOF
      - name: Verify authentic catalog, private-column exclusions and dry run
        run: |
          php -l well-known/scripts/import-netvera-public.php
          php -r '
          $p=json_decode(file_get_contents("well-known/database/netvera-public-catalog.json"),true,512,JSON_THROW_ON_ERROR);
          foreach(["categories"=>3,"products"=>16,"images"=>41,"blog_categories"=>9,"blog_posts"=>5,"approved_reviews"=>2] as $k=>$count) {
            if(count($p[$k]??[])!==$count){fwrite(STDERR,"Record count failed: ".$k."\n");exit(1);}
          }
          foreach(["products","blog_posts","approved_reviews"] as $type){
            foreach($p[$type] as $item){foreach(array_keys($item) as $key){
              if(preg_match("/merchant|secret|salt|password|token|api.?key|demo_accounts|demo_admin|demo_user|shopier_payment/i",$key))exit(2);
            }}
          }
          echo "Authentic, public-only catalogue metadata: OK\n";
          '
          php well-known/scripts/import-netvera-public.php well-known/database/netvera-public-catalog.json
      - name: Apply twice to test idempotency and untouched payment tables
        shell: bash
        run: |
          set -euo pipefail
          db() { mysql -h127.0.0.1 -uroot -pmigration_qa_only -N netvera_migration_qa -e "$1"; }
          before=$(db "SELECT CONCAT((SELECT COUNT(*) FROM orders),':',(SELECT COUNT(*) FROM order_items),':',(SELECT COUNT(*) FROM payment_gateways))")
          php well-known/scripts/import-netvera-public.php well-known/database/netvera-public-catalog.json --apply
          php well-known/scripts/import-netvera-public.php well-known/database/netvera-public-catalog.json --apply
          after=$(db "SELECT CONCAT((SELECT COUNT(*) FROM orders),':',(SELECT COUNT(*) FROM order_items),':',(SELECT COUNT(*) FROM payment_gateways))")
          if [ "$before" != "$after" ]; then echo "Payment/order table counts changed"; exit 1; fi
          [ "$(db 'SELECT COUNT(*) FROM nv_legacy_script_products WHERE active=1')" = "16" ]
          [ "$(db 'SELECT COUNT(*) FROM nv_legacy_script_categories WHERE active=1')" = "3" ]
          [ "$(db 'SELECT COUNT(*) FROM nv_legacy_script_images WHERE active=1')" = "41" ]
          [ "$(db 'SELECT COUNT(*) FROM nv_legacy_public_reviews')" = "2" ]
          [ "$(db 'SELECT COUNT(DISTINCT slug) FROM blog_posts WHERE slug IN ("sosyal-medya-yonetimi-nedir-isletmeler-icin-rehber","php-hafriyat-scripti-hazir-hafriyat-web-sitesi","php-bobinajci-scripti-hazir-bobinaj-web-sitesi","google-maps-isletme-bulucu-programi-nasil-olmali","yapay-zeka-haber-yazilimi-otomatik-haber-sitesi")')" = "5" ]
          echo "PASS: 16 products / 3 categories / 41 galleries / 5 blogs / 2 approved reviews; repeated import; unchanged payment tables"
      - name: Verify indexed routes on real imported records
        run: |
          php -S 127.0.0.1:8917 -t well-known/public well-known/tests/router.php >/tmp/netvera-migration-qa.log 2>&1 &
          sleep 3
          curl -fsS -o /tmp/netvera-list.html http://127.0.0.1:8917/hazir-scriptler
          curl -fsS -o /tmp/netvera-detail.html http://127.0.0.1:8917/hazir-scriptler/haber-sitesi-scripti
          curl -fsS -o /tmp/netvera-blog.html http://127.0.0.1:8917/blog/yapay-zeka-haber-yazilimi-otomatik-haber-sitesi
          grep -q 'hazir-scriptler/haber-sitesi-scripti' /tmp/netvera-list.html
          grep -q 'SoftwareApplication' /tmp/netvera-detail.html
          grep -q 'canonical' /tmp/netvera-blog.html
          grep -q 'Yapay Zeka Haber' /tmp/netvera-blog.html
          echo "PASS: original indexed paths render on staging with authentic records"
      - name: PHP server diagnostics
        if: failure()
        run: tail -n 160 /tmp/netvera-migration-qa.log 2>/dev/null || true
