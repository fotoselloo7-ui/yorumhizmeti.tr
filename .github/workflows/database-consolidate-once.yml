name: Build Consolidated Database Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/database-consolidate-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: consolidate_ci_only
          MYSQL_DATABASE: netvera_consolidated
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -pconsolidate_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, curl, gd
          tools: none

      - name: Install MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client

      - name: Configure isolated database environment
        shell: bash
        run: |
          cat > well-known/.env <<'EOF'
          APP_NAME="NetVera Database Consolidation"
          APP_ENV=local
          APP_DEBUG=false
          APP_URL=http://127.0.0.1:8006
          DB_HOST=127.0.0.1
          DB_NAME=netvera_consolidated
          DB_USER=root
          DB_PASS=consolidate_ci_only
          DB_CHARSET=utf8mb4
          LICENSE_ENABLED=false
          LICENSE_LOCAL_BYPASS=true
          NETVERA_LOCAL_AUTO_SETUP=0
          NETVERA_IMPORT_ALLOWED=1
          EOF
          mkdir -p well-known/storage/cache well-known/storage/logs well-known/public/uploads

      - name: Restore repository snapshot and apply current production schema
        shell: bash
        run: |
          set -euo pipefail
          db() { mysql --host=127.0.0.1 --port=3306 -uroot -pconsolidate_ci_only netvera_consolidated "$@"; }

          db < yorumhizmeti_yorumhizmeti.sql

          # Tables added after the 28 Aug 2026 repository snapshot.
          db < well-known/database/migration_contact_newsletter.sql
          db < well-known/database/migrations/home-hero-slider-v94.sql
          db < well-known/database/migrations/discount-system-v98.sql
          db < well-known/database/migrations/netvera-dealer-program-v2.sql
          db < well-known/database/migrations/netvera-editorial-seo-v1.sql
          db < well-known/database/migrations/netvera-private-customer-v1.sql
          db < well-known/database/migrations/smm-multi-provider-v1.sql

          # Import the repository's real public NetVera catalogue. The importer
          # owns the legacy bridge + inquiry v1 schema and is intentionally used
          # instead of synthetic CI product fixtures.
          PAGES_PREVIEW_CI_ONLY=1 php well-known/scripts/import-netvera-public.php \
            well-known/database/netvera-public-catalog.json --apply

          db < well-known/database/migrations/netvera-inquiries-v2.sql
          db < well-known/database/migrations/retired-software-links-v1.sql

      - name: Synchronize current NetVera brand defaults
        shell: bash
        run: |
          cat > /tmp/netvera-sync-brand.php <<'PHP'
          <?php
          define('BASE_PATH', getcwd().'/well-known');
          spl_autoload_register(function(string $class){
              $prefix='App\\';
              if(strncmp($prefix,$class,strlen($prefix))!==0)return;
              $file=BASE_PATH.'/app/'.str_replace('\\','/',substr($class,strlen($prefix))).'.php';
              if(is_file($file))require $file;
          });
          require BASE_PATH.'/app/Core/Helpers.php';
          foreach(file(BASE_PATH.'/.env',FILE_IGNORE_NEW_LINES|FILE_SKIP_EMPTY_LINES)?:[] as $line){
              $line=trim($line);
              if($line===''||$line[0]==='#'||!str_contains($line,'='))continue;
              [$key,$value]=explode('=',$line,2);
              $key=trim($key); $value=trim($value," \t\n\r\0\x0B\"'");
              $_ENV[$key]=$value; putenv($key.'='.$value);
          }
          $config=App\Services\SiteConfigService::getInstance();
          App\Services\NetveraBrandSettings::syncExisting($config);
          PHP
          php /tmp/netvera-sync-brand.php

      - name: Boot current storefront to initialize runtime-managed tables and defaults
        shell: bash
        run: |
          php -S 127.0.0.1:8006 -t well-known/public well-known/tests/router.php >/tmp/database-build-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8006/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8006/ >/dev/null
          curl -fsS http://127.0.0.1:8006/kategoriler >/dev/null
          curl -fsS http://127.0.0.1:8006/hazir-scriptler >/dev/null
          curl -fsS http://127.0.0.1:8006/blog >/dev/null
          curl -fsS http://127.0.0.1:8006/iletisim >/dev/null
          curl -fsS http://127.0.0.1:8006/sss >/dev/null
          kill $SERVER_PID 2>/dev/null || true
          trap - EXIT

      - name: Export one clean portable SQL file
        shell: bash
        run: |
          set -euo pipefail
          mysql --host=127.0.0.1 --port=3306 -uroot -pconsolidate_ci_only netvera_consolidated -e "
            UPDATE settings SET setting_value='noreply@netvera.tr'
              WHERE setting_key='smtp_from_email' AND setting_value='noreply@yorumhizmeti.tr';
            UPDATE settings SET setting_value='NetVera Teknoloji Yazılım'
              WHERE setting_key='smtp_from_name' AND setting_value IN ('Yorum Hizmeti','YorumHizmeti.tr');
          "
          mkdir -p consolidated-database
          mysqldump \
            --host=127.0.0.1 --port=3306 \
            -uroot -pconsolidate_ci_only \
            --single-transaction \
            --skip-comments \
            --skip-add-locks \
            --set-gtid-purged=OFF \
            --no-tablespaces \
            --default-character-set=utf8mb4 \
            --hex-blob \
            netvera_consolidated > consolidated-database/database.sql

          {
            echo '-- NetVera Teknoloji Yazılım — consolidated database'
            echo '-- Generated from the repository snapshot + current schema + real public catalogue.'
            echo '-- Import this file into an EMPTY MySQL/MariaDB database.'
            echo '-- No CREATE DATABASE / USE statement is included; cPanel database names remain portable.'
            echo
            cat consolidated-database/database.sql
          } > consolidated-database/database.final.sql
          mv consolidated-database/database.final.sql consolidated-database/database.sql
          sed -i 's/utf8mb4_0900_ai_ci/utf8mb4_unicode_ci/g' consolidated-database/database.sql

          echo "Tables:"
          mysql --host=127.0.0.1 --port=3306 -uroot -pconsolidate_ci_only -N netvera_consolidated \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='netvera_consolidated';"
          echo "Dump bytes:"
          wc -c consolidated-database/database.sql

      - name: Commit canonical database.sql
        shell: bash
        run: |
          set -euo pipefail
          cp consolidated-database/database.sql well-known/database/database.sql
          git config user.name "netvera-database-bot"
          git config user.email "actions@users.noreply.github.com"
          git add well-known/database/database.sql
          if git diff --cached --quiet; then
            echo "database.sql already current"
          else
            git commit -m "Build canonical consolidated database.sql"
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: consolidated-database-sql
          path: consolidated-database/database.sql
          retention-days: 2
          if-no-files-found: error
